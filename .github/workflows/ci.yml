name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-memory:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test package invariants
        run: python tests/test_package.py

  windows-one-click:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test install, update, and uninstall
        shell: pwsh
        run: ./tests/test_one_click.ps1
